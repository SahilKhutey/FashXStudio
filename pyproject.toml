[project]
name = "ai-fashion-assistant"
version = "0.1.0"
description = "AI Fashion Assistant - Foundation 0 production build"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi[standard]==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "asyncpg==0.30.0",
  "alembic==1.20.0",
  "redis==6.4.0",
  "sentry-sdk[fastapi]==2.37.1",
  "pillow>=10.4.0",
  "numpy>=1.26.0",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.0",
  "mypy==1.18.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.0",
  "mypy==1.18.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"



[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/fashx", "schemas", "database"]

[tool.hatch.build.targets.wheel.sources]
"backend" = ""

