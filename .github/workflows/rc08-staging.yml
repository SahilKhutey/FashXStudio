name: rc08-staging
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/rc08-staging-pilot-readiness

permissions:
  contents: read

concurrency:
  group: rc08-staging
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation
        run: python scripts/docs_lint.py
      - name: Validate patch
        run: git diff --check

  backend:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" || pip install -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .
      - name: Unit tests
        run: python -m pytest tests/unit -q

  mobile:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npx jest --ci

  staging-readiness:
    needs:
      - backend
      - mobile
    runs-on: ubuntu-latest
    steps:
      - name: Staging pre-deployment checks
        run: echo "Staging preflight, backend, and mobile release checks cleared."
