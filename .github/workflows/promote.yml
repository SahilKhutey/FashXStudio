name: promote
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: Immutable ECR tag, e.g. sha-<commit-sha>
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: fashx-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Install AWS CLI and jq
        run: |
          aws --version
          jq --version
      - name: Promote immutable image
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            development) TARGET=dev ;;
            staging) TARGET=staging ;;
            production) TARGET=prod ;;
            *) exit 2 ;;
          esac
          bash scripts/release/promote_ecs.sh "$TARGET" "$IMAGE_TAG"
