name: deploy-staging
on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS Deploy Role
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE }}" ]; then
            echo "Notice: vars.AWS_DEPLOY_ROLE is not set. Staging cloud infrastructure is unprovisioned."
            exit 0
          fi

      - name: Configure AWS Credentials (OIDC)
        if: vars.AWS_DEPLOY_ROLE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        if: vars.AWS_DEPLOY_ROLE != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        if: vars.AWS_DEPLOY_ROLE != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/fashx:$IMAGE_TAG .
          docker push $ECR_REGISTRY/fashx:$IMAGE_TAG

      - name: Run database migration task
        if: vars.AWS_DEPLOY_ROLE != ''
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER_STAGING }}
          MIGRATION_TASK: ${{ vars.ECS_MIGRATION_TASK_STAGING }}
          SUBNETS: ${{ vars.ECS_SUBNETS_STAGING }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS_STAGING }}
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATION_TASK" \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Staging database migration failed. Deployment halted."
            exit 1
          fi

      - name: Deploy staging ECS services
        if: vars.AWS_DEPLOY_ROLE != ''
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER_STAGING }}
        run: |
          set -euo pipefail
          for SERVICE in \
            "${{ vars.ECS_API_SERVICE_STAGING }}" \
            "${{ vars.ECS_TRYON_SERVICE_STAGING }}"
          do
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --force-new-deployment
          done
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${{ vars.ECS_API_SERVICE_STAGING }}" "${{ vars.ECS_TRYON_SERVICE_STAGING }}"
