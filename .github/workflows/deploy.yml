name: deploy
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "Target deployment environment"
        options:
          - staging
          - prod
        required: true
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS Deploy Role
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE }}" ]; then
            echo "ERROR: vars.AWS_DEPLOY_ROLE is not set. Real cloud deployment requires a configured IAM role."
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/fashx:$IMAGE_TAG .
          docker push $ECR_REGISTRY/fashx:$IMAGE_TAG

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ format('{0}/fashx:{1}', steps.login-ecr.outputs.registry, github.sha) }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Run Database Migrations (One-off Migrator Task)
        run: |
          echo "Running alembic migration task on ${{ inputs.env || 'staging' }} cluster..."
          # aws ecs run-task --cluster fashx-${{ inputs.env || 'staging' }} --task-definition fashx-migrate ...

      - name: Update ECS Services
        run: |
          echo "Updating ECS services to new image tag ${{ github.sha }}..."
          # aws ecs update-service --cluster fashx-${{ inputs.env || 'staging' }} --service fashx-api --force-new-deployment

      - name: Set up Python for Smoke Testing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Smoke Verification
        run: |
          pip install httpx
          if [ -n "${{ vars.API_BASE }}" ]; then
            python scripts/release/smoke.py --base "${{ vars.API_BASE }}" --token "${{ secrets.SMOKE_TEST_TOKEN }}"
          else
            echo "ERROR: vars.API_BASE must be set for smoke verification."
            exit 1
          fi
