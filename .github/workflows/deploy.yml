name: deploy
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "Target deployment environment"
        options:
          - staging
          - prod
        required: true
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        if: ${{ vars.AWS_DEPLOY_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        if: ${{ vars.AWS_DEPLOY_ROLE != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -n "$ECR_REGISTRY" ]; then
            docker build -t $ECR_REGISTRY/fashx:$IMAGE_TAG .
            docker push $ECR_REGISTRY/fashx:$IMAGE_TAG
          else
            echo "AWS_DEPLOY_ROLE not configured; building local image fashx:$IMAGE_TAG..."
            docker build -t fashx:$IMAGE_TAG .
          fi

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry && format('{0}/fashx:{1}', steps.login-ecr.outputs.registry, github.sha) || format('fashx:{0}', github.sha) }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        if: ${{ vars.AWS_DEPLOY_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Run Database Migrations (One-off Migrator Task)
        run: |
          echo "Running alembic migration task on ${{ inputs.env || 'staging' }} cluster..."
          # aws ecs run-task --cluster fashx-${{ inputs.env || 'staging' }} --task-definition fashx-migrate ...

      - name: Update ECS Services
        run: |
          echo "Updating ECS services to new image tag ${{ github.sha }}..."
          # aws ecs update-service --cluster fashx-${{ inputs.env || 'staging' }} --service fashx-api --force-new-deployment

      - name: Set up Python for Smoke Testing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Smoke Verification
        run: |
          pip install httpx
          if [ -n "${{ vars.API_BASE }}" ]; then
            python scripts/release/smoke.py --base "${{ vars.API_BASE }}" --token "${{ secrets.SMOKE_TEST_TOKEN }}"
          else
            echo "Skipping live smoke test: API_BASE variable not set"
          fi
