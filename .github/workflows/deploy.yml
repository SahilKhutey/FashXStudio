name: deploy

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "Target deployment environment"
        options:
          - staging
          - prod
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      image_uri: ${{ steps.build-push.outputs.image_uri }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS Deploy Role
        id: check-role
        run: |
          ROLE="${{ vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE }}"
          if [ -z "$ROLE" ]; then
            echo "ERROR: vars.AWS_DEPLOY_ROLE_ARN is not set. Real cloud deployment requires a configured IAM role."
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$REGISTRY/fashx:$IMAGE_TAG" \
            --metadata-file /tmp/build-metadata.json \
            .
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)"
          IMAGE_URI="$REGISTRY/fashx@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.build-push.outputs.image_uri }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE }}
          aws-region: ap-south-1

      - name: Capture Previous Task Definitions for Rollback
        id: capture-state
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          TRYON_SERVICE: ${{ vars.ECS_TRYON_SERVICE }}
          INGEST_SERVICE: ${{ vars.ECS_INGEST_SERVICE }}
          BEAT_SERVICE: ${{ vars.ECS_BEAT_SERVICE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/deploy-state
          jq -n \
            --arg api "$(aws ecs describe-services --cluster "$CLUSTER" --services "$API_SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo '')" \
            --arg tryon "$(aws ecs describe-services --cluster "$CLUSTER" --services "$TRYON_SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo '')" \
            --arg ingest "$(aws ecs describe-services --cluster "$CLUSTER" --services "$INGEST_SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo '')" \
            --arg beat "$(aws ecs describe-services --cluster "$CLUSTER" --services "$BEAT_SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo '')" \
            '{($api_svc): $api, ($tryon_svc): $tryon, ($ingest_svc): $ingest, ($beat_svc): $beat}' \
            --arg api_svc "$API_SERVICE" \
            --arg tryon_svc "$TRYON_SERVICE" \
            --arg ingest_svc "$INGEST_SERVICE" \
            --arg beat_svc "$BEAT_SERVICE" \
            > /tmp/deploy-state/rollback_state.json

      - name: Run database migration task
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          MIGRATION_TASK: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          TASK_DEF_FILE="$(mktemp)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          TARGET_ENV="${{ inputs.env }}"
          if [ "$TARGET_ENV" = "prod" ]; then
            ENV_TPL="production"
          else
            ENV_TPL="staging"
          fi
          sed \
            -e "s|\${ACCOUNT_ID}|$ACCOUNT_ID|g" \
            -e "s|\${IMAGE_TAG}|sha-${{ github.sha }}|g" \
            "infra/aws/ecs/task-definitions/migration-${ENV_TPL}.json" > "$TASK_DEF_FILE"
          
          jq --arg img "$IMAGE_URI" '.containerDefinitions[0].image = $img' "$TASK_DEF_FILE" > "${TASK_DEF_FILE}.rendered"
          MIGRATION_TASK_ARN="$(aws ecs register-task-definition --cli-input-json "file://${TASK_DEF_FILE}.rendered" --query 'taskDefinition.taskDefinitionArn' --output text)"
          rm -f "$TASK_DEF_FILE" "${TASK_DEF_FILE}.rendered"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATION_TASK_ARN" \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed. Deployment stopped."
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Deploy ECS services
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          TARGET_ENV="${{ inputs.env }}"
          if [ "$TARGET_ENV" = "prod" ]; then
            ENV_TPL="production"
          else
            ENV_TPL="staging"
          fi

          deploy_service() {
            local service="$1"
            local template="$2"
            local container="$3"

            local tmpfile
            tmpfile="$(mktemp)"
            sed \
              -e "s|\${ACCOUNT_ID}|$ACCOUNT_ID|g" \
              -e "s|\${IMAGE_TAG}|sha-${{ github.sha }}|g" \
              "$template" > "$tmpfile"
            
            jq --arg img "$IMAGE_URI" --arg c "$container" \
              '.containerDefinitions |= map(if .name == $c then .image = $img else . end)' \
              "$tmpfile" > "${tmpfile}.rendered"
            
            local task_arn
            task_arn="$(aws ecs register-task-definition --cli-input-json "file://${tmpfile}.rendered" --query 'taskDefinition.taskDefinitionArn' --output text)"
            rm -f "$tmpfile" "${tmpfile}.rendered"

            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$service" \
              --task-definition "$task_arn" \
              --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},minimumHealthyPercent=100,maximumPercent=200" \
              >/dev/null
          }

          deploy_service "${{ vars.ECS_API_SERVICE }}" "infra/aws/ecs/task-definitions/api-${ENV_TPL}.json" "fashx-api"
          deploy_service "${{ vars.ECS_TRYON_SERVICE }}" "infra/aws/ecs/task-definitions/tryon-${ENV_TPL}.json" "fashx-tryon"
          deploy_service "${{ vars.ECS_INGEST_SERVICE }}" "infra/aws/ecs/task-definitions/ingest-${ENV_TPL}.json" "fashx-ingest"
          deploy_service "${{ vars.ECS_BEAT_SERVICE }}" "infra/aws/ecs/task-definitions/beat-${ENV_TPL}.json" "fashx-beat"

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services \
              "${{ vars.ECS_API_SERVICE }}" \
              "${{ vars.ECS_TRYON_SERVICE }}" \
              "${{ vars.ECS_INGEST_SERVICE }}" \
              "${{ vars.ECS_BEAT_SERVICE }}"

      - name: Post-deployment smoke test
        env:
          API_BASE: ${{ vars.API_BASE }}
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$API_BASE"
          python scripts/release/smoke.py --base "$API_BASE"

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
          ECS_TRYON_SERVICE: ${{ vars.ECS_TRYON_SERVICE }}
          ECS_INGEST_SERVICE: ${{ vars.ECS_INGEST_SERVICE }}
          ECS_BEAT_SERVICE: ${{ vars.ECS_BEAT_SERVICE }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          echo "::error::Deployment failed. Initiating automatic rollback..."
          bash scripts/release/rollback_ecs.sh "${{ inputs.env }}" /tmp/deploy-state/rollback_state.json
