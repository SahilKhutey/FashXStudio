name: deploy
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "Target deployment environment"
        options:
          - staging
          - prod
        required: true
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS Deploy Role
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE }}" ]; then
            echo "ERROR: vars.AWS_DEPLOY_ROLE is not set. Real cloud deployment requires a configured IAM role."
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/fashx:$IMAGE_TAG .
          docker push $ECR_REGISTRY/fashx:$IMAGE_TAG

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ format('{0}/fashx:{1}', steps.login-ecr.outputs.registry, github.sha) }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}"
          aws-region: ap-south-1

      - name: Run database migration task
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          MIGRATION_TASK: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATION_TASK" \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed. Deployment stopped."
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Deploy ECS services
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for SERVICE in \
            "${{ vars.ECS_API_SERVICE }}" \
            "${{ vars.ECS_TRYON_SERVICE }}" \
            "${{ vars.ECS_INGEST_SERVICE }}" \
            "${{ vars.ECS_BEAT_SERVICE }}"
          do
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --force-new-deployment
          done
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services \
              "${{ vars.ECS_API_SERVICE }}" \
              "${{ vars.ECS_TRYON_SERVICE }}" \
              "${{ vars.ECS_INGEST_SERVICE }}" \
              "${{ vars.ECS_BEAT_SERVICE }}"

      - name: Set up Python for Smoke Testing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post-deployment smoke test
        env:
          API_BASE: ${{ vars.API_BASE }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          set -euo pipefail
          pip install httpx
          test -n "$API_BASE"
          python scripts/release/smoke.py \
            --base "$API_BASE" \
            --token "$SMOKE_TOKEN"
