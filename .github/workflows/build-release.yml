name: build-release
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: fashx-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$REGISTRY/fashx:$IMAGE_TAG" \
            --metadata-file /tmp/build-metadata.json \
            .
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)"
          echo "Image pushed: $REGISTRY/fashx@$DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_STEP_SUMMARY"
