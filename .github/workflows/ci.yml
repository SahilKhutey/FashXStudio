name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: fashx, POSTGRES_PASSWORD: fashx, POSTGRES_DB: fashx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashx -d fashx_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://fashx:fashx@localhost:5432/fashx_test
      TEST_DATABASE_URL: postgresql+psycopg://fashx:fashx@localhost:5432/fashx_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_JWT_SECRET: "ci-test-jwt-secret-key-32-chars-minimum"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" || pip install -e .
      - run: python scripts/docs_lint.py
      - run: ruff check . --exit-zero
      - run: mypy .
      - run: python -m alembic heads
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest tests -q -p no:cacheprovider -m "not frozen"

  frozen:
    runs-on: ubuntu-latest
    continue-on-error: true # Deliberate: frozen post-MVP commerce domains (C05-C11) are unmounted by default in production and isolated from blocking MVP release
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: fashx, POSTGRES_PASSWORD: fashx, POSTGRES_DB: fashx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashx -d fashx_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://fashx:fashx@localhost:5432/fashx_test
      TEST_DATABASE_URL: postgresql+psycopg://fashx:fashx@localhost:5432/fashx_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_JWT_SECRET: "ci-test-jwt-secret-key-32-chars-minimum"
      FASHX_ENABLE_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" || pip install -e .
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q -p no:cacheprovider -m "frozen"

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0 || true # Deliberate: awaiting full eslint flat-config adoption in PR 8B-1
      - run: npx jest --ci
      - run: npx expo-doctor
      - run: npx expo export --platform android # proves the JS bundle builds

  api-types:
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: "ci-test-jwt-secret-key-32-chars-minimum"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -e ".[dev]" || pip install -e .
      - run: |
          python -c "import json; from fashx.main import app; open('openapi.json', 'w').write(json.dumps(app.openapi(), indent=2))"
          npx -y openapi-typescript openapi.json -o mobile/src/api/schema.generated.d.ts
          diff -u mobile/src/api/schema.d.ts mobile/src/api/schema.generated.d.ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install bandit pip-audit
      - run: bandit -r backend/fashx -ll -ii
      - run: pip-audit --desc on || true # Deliberate: security audit reporting; non-blocking on advisory notices
