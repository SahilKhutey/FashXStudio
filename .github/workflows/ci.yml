# Starting point: adjust paths/env names to match your .env.example and final structure.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: fashx, POSTGRES_PASSWORD: fashx, POSTGRES_DB: fashx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashx" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PYTHONPATH: ".:api"
      DATABASE_URL: postgresql+psycopg://fashx:fashx@localhost:5432/fashx_test   # match .env.example key/driver
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" || pip install -e .
      - run: ruff check .
      - run: mypy .
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q --maxfail=5
      - name: Report test count (source of truth for README claims)
        run: python -m pytest tests --collect-only -q | tail -n 1

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
