name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: fashx, POSTGRES_PASSWORD: fashx, POSTGRES_DB: fashx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashx" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://fashx:fashx@localhost:5432/fashx_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" || pip install -e .
      - run: ruff check . --exit-zero
      - run: mypy .
      - run: python -m alembic heads
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q -p no:cacheprovider
