[project]
name = "ai-fashion-assistant"
version = "0.1.0"
description = "AI Fashion Assistant - Foundation 0 production build"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi[standard]==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "asyncpg==0.30.0",
  "alembic==1.20.0",
  "redis==6.4.0",
  "sentry-sdk[fastapi]==2.37.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.0",
  "mypy==1.18.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api", "schemas", "tests", "database"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["."]

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "schemas", "database"]
